# quirq infra manifest for qq-config (schema quirq-repo/1). It makes this a qq repo, so
# `qq sync` fetches the pinned Python and `qq cfg ...` (infra/commands/cfg.sh) runs qqcfg with it.
schema = "quirq-repo/1"

[qq]
version = "0.1.0"

# The same Python pin as quirq-ai/xo-space (quirq-ai/toolchains promoted.toml, python 3.14.8).
[toolchains.python]
version = "3.14.8"
platforms."linux-x86_64" = { source = "oci://ghcr.io/quirq-ai/toolchains/python@sha256:32c0b762db5ec5453e63cf057ab4fa072751a19f1af70f08c07ac4f5fb70a716", digest = "sha256:230c6677ccbaba9043c810b9c4a6096ed354c8a981bb62ea90bd059b12d1b03c" }

# The config itself. No recipes adapter builds this kind: it is checked by `qq cfg validate` and
# by .github/workflows/validate.yml, not by `qq build` or `qq test`.
[[targets]]
name = "config"
kind = "qq-config"
srcs = ["config/**", "generated/**", "infra-config.commit"]
