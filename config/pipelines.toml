# Builders: what runs, on which trigger, in which pool. Pipelines follow Chromium's split:
# presubmit (on the change, inside the gate), postsubmit (every main commit), release, and perf
# (perf.toml). Fuzz schedules live in fuzz.toml.
# Triggers are backend-neutral; the github backend maps them when it generates workflows:
#   change   -> a proposed change (GitHub pull_request)
#   queue    -> the exact merge result inside the gate (GitHub merge_group)
#   land     -> a commit landing on the default branch (GitHub push)
#   schedule -> a timer; release builders take theirs from channels.toml

[area]
name = "pipelines"
status = "seed"
schema = "v0"
owners = []            # suraj fills in
read_by = ["gate", "gardener", "tools/qqcfg.py generate"]
chromium = "try and ci builders in infra/config/subprojects/chromium/*.star, generated by lucicfg"

# Every builder lives here; each repo keeps only its manifest (plan D15, decided 2026-10-03).
# Chromium keeps them in the tree they build (chromium/src/infra/config).

[defaults]
backend = "github"            # v0; Launchpad later (org.toml backends)
timeout_minutes = 30
# qq-drift accepts stubs that main generated up to this many days ago (with a warning to redeliver),
# so a generator change does not turn every open product PR red at once (audit S3).
drift_grace_days = 7
# V0-GAT-04: the merge-queue (queue-triggered) builder of each repo ends with gate's timing step,
# one sample per gate run. Pinned by commit. TODO(expert): let rollers move this pin.
timing = "quirq-ai/gate/timing@7a4fb535d936b51cdcc8b66e8004e5609b4ee6a4"

# V0-TST-01: every generated builder that runs tests ends with the result sink, so each gate and
# post-submit run's results are stored (the results store collects the qq-results-* artifacts,
# V0-TST-02). It reads each kind's test_reports (kinds.toml); a kind without them gets a one-case
# report from its test step's outcome. Pinned by commit. TODO(expert): let rollers move this pin.
[defaults.results]
sink = "quirq-ai/test-pipelines/sink@28f49a0a5bbe620c3419d7b859ae896e6ded4fa9"   # 1e3ddb1+ reads QQ_QUEUED_AT; 1a54cc2+ takes commit; 28f49a0 is the v0 pin (rerun stays off)

# --- xo-space -------------------------------------------------------------------------------

[[builder]]
name = "qq-sandbox-presubmit"
repo = "qq-sandbox"
pipeline = "presubmit"
triggers = ["change", "queue"]
kinds = ["pytest"]
capabilities = ["fetch", "test"]
pool = "untrusted"
blocking = true
timeout_minutes = 10
generate = true

[[builder]]
name = "qq-sandbox-postsubmit"
repo = "qq-sandbox"
pipeline = "postsubmit"
triggers = ["land"]
kinds = ["pytest"]
capabilities = ["fetch", "test"]
pool = "trusted"
cancel_in_progress = false
generate = true
